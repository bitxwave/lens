[package]
name = "navsrv"
version = "0.1.0"
edition = "2021"
rust-version = "1.79"
default-run = "navsrv"

[[bin]]
name = "navsrv"
path = "src/main.rs"

[lib]
name = "navsrv"
path = "src/lib.rs"

[dependencies]
axum = { version = "0.7", features = ["macros", "multipart"] }
tokio = { version = "1", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["fs", "trace", "compression-gzip", "set-header"] }
tower-sessions = "0.10"
tower-sessions-sqlx-store = { version = "0.10", features = ["sqlite"] }
tower_governor = "0.3"

sqlx = { version = "0.7", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "chrono", "json", "macros", "migrate"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
validator = { version = "0.16", features = ["derive"] }

bcrypt = "0.15"
rand = "0.8"

clap = { version = "4", features = ["derive"] }
figment = { version = "0.10", features = ["toml", "env"] }
dotenvy = "0.15"

thiserror = "1"
anyhow = "1"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }

reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
mime = "0.3"
multer = "3"
bytes = "1"
async-trait = "0.1"

[dev-dependencies]
axum-test = "15"
tempfile = "3"
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
